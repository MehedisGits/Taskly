name: task_manager
description: "**Taskly - Task Manager App**    **Description:**   Taskly is a sleek and efficient task management app built using Flutter in Android Studio. Designed for individuals and teams, it offers task creation, categorization, prioritization, and progress tracking. Features include reminders, real-time notifications, offline functionality, and cross-platform compatibility. With a modern UI and customizable themes, Taskly streamlines productivity and organization."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  dart_jsonwebtoken: ^2.16.0
  device_preview: ^1.2.0
  get: ^4.6.6
  dio: ^5.7.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.2
  shimmer: ^3.0.0
  connectivity_plus: ^5.0.2


  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/flutter.png
